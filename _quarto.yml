project:
  type: website
  output-dir: _site

  resources:
    - images/**
    - CNAME

website:
  title: "Observatório da Formação do Sanitarista"
  description: "Painel da Formação do Sanitarista no Brasil"

  search:
    location: navbar
    type: overlay

  site-url: https://painel-da-paula.com

  favicon: images/logo_painel.png

  navbar:
    logo: images/logo_painel.png
    title: false

    left:
      - href: index.qmd
        text: Início

      - href: "#sobre"
        text: Apresentação

      - href: "#objetivo"
        text: Objetivo

      - href: "#indicadores"
        text: Indicadores

      - href: "#dashboard"
        text: Painel da Formação

      - href: "#biblioteca"
        text: Biblioteca

      - href: "#quem-somos"
        text: Quem Somos

  page-footer:

    background: "#011a36"

    left: |
      ![](images/ufes.png){width=40%}

    center: |
       ![](images/programa.jpg){width=60%}

    right: |
      ![](images/FAPES.png){width=90%}

# O parâmetro language fica na raiz
language:
  search-text: "Busca"

format:
  html:
    theme: flatly
    css: styles.css
    toc: true
    email-obfuscation: javascript
    page-layout: full
    include-in-header:
      text: |
        <style>
          #paineis-slider {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9; /* Mantém a proporção de tela sem fixar altura */
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            background-color: transparent;
          }
          #paineis-slider img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Exibe a imagem inteira sem cortar nada */
          }
        </style>